# Optional development dependencies for the future production adapter.
# The current API remains SQLite-only until its PostgreSQL repository is added.
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ruaskita
      POSTGRES_USER: ruaskita
      POSTGRES_PASSWORD: ruaskita-dev-only
    ports:
      - "5432:5432"
    volumes:
      - ruaskita-postgis:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ruaskita-redis:/data

volumes:
  ruaskita-postgis:
  ruaskita-redis:
