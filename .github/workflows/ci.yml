name: RuasKita CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      RUASKITA_DISABLE_MODEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements-dev.txt
      - name: Run API contract tests
        run: python -m unittest discover -s services/api/tests -v
      - name: Run AI release contract tests
        run: python -m unittest discover -s ai_engine/tests -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Production build
        working-directory: apps/web
        run: npm run build
